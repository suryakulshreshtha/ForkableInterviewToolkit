name: Python + Playwright

on:
  push:
    branches: [main]
    paths:
      - 'projects/Python-Playwright-Automation/**'
      - '.github/workflows/python-playwright.yml'
  pull_request:
    paths:
      - 'projects/Python-Playwright-Automation/**'
      - '.github/workflows/python-playwright.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    uses: suryakulshreshtha/.github/.github/workflows/python-playwright.yml@v1
    with:
      working-directory: projects/Python-Playwright-Automation
      browsers: '["chromium"]'
      pytest-args: framework/tests
