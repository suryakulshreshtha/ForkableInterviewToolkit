[pytest]
testpaths = framework/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    -ra

markers =
    smoke: fast critical-path checks
    ui: browser-driven UI tests
    table: web-table / data-extraction tests
    dialogs: alert, frame, and window-handling tests

# Playwright defaults (override on the CLI: --headed, --browser firefox, --slowmo 500)
base_url = https://rahulshettyacademy.com/AutomationPractice/
